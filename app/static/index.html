<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFTP Browser</title>
<style>
:root {
  --bg: #f0f0f0; --panel: #ffffff; --panel-alt: #f7f9fc; --border: #c9ced6; --border-soft: #e2e5ea;
  --text: #1d1f23; --muted: #6b7280; --accent: #1f6fd1; --accent-soft: #e6f0fc;
  --sel: #cce8ff; --sel-border: #99d1ff; --hover: #e5f3ff; --danger: #c62828; --ok: #2e7d32; --warn: #b26a00;
  --btn: linear-gradient(#fdfdfd, #e9ebee); --btn-hover: linear-gradient(#ffffff, #dde6f3);
  --folder: #f2c34d; --folder-dark: #d9a52a; --file: #8a94a6; --bar: #3b8ae6; --bar-bg: #dfe3e8;
  --shadow: 0 6px 24px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2b2d31; --panel: #1f2023; --panel-alt: #25272b; --border: #44474d; --border-soft: #34363b;
    --text: #e3e5e8; --muted: #9aa0a8; --accent: #5aa2ff; --accent-soft: #23344d;
    --sel: #264f78; --sel-border: #3a6ea5; --hover: #2c3440; --danger: #ef6b6b; --ok: #6cc36f; --warn: #e5a54b;
    --btn: linear-gradient(#3a3d42, #313338); --btn-hover: linear-gradient(#44484e, #3a3e44);
    --folder: #e8b93f; --folder-dark: #c5962a; --file: #9aa3b2; --bar: #4c9aff; --bar-bg: #3a3d42;
    --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 3px 5px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
svg.i { width: 16px; height: 16px; flex: none; }

/* ---------- header ---------- */
#hdr { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-bottom: 1px solid var(--border); background: var(--bg); min-width: 0; }
#conn { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
#conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
#conn .dot.ready { background: var(--ok); } #conn .dot.connecting { background: var(--warn); animation: pulse 1s infinite; }
#conn .dot.error, #conn .dot.nomux { background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }
#conn .host { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#conn .mode { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid transparent; border-radius: 3px; background: none; cursor: default; padding: 0; flex: none; }
.ibtn:hover:not(:disabled) { background: var(--btn-hover); border-color: var(--border); }
.ibtn:active:not(:disabled) { transform: translateY(1px); }
.ibtn.on { background: var(--accent-soft); border-color: var(--sel-border); }
.ibtn:disabled { opacity: .35; }

/* ---------- toolbar + path ---------- */
#tb { display: flex; align-items: center; gap: 1px; padding: 3px 4px; background: var(--bg); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
#tb .sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }
#pathrow { display: flex; gap: 4px; padding: 4px 6px; background: var(--bg); border-bottom: 1px solid var(--border); }
#path { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

/* ---------- banner ---------- */
#banner { display: none; padding: 10px; margin: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel); }
#banner.show { display: block; }
#banner h3 { margin: 0 0 4px; font-size: 13px; }
#banner p { margin: 4px 0 8px; color: var(--muted); }
#banner pre { background: var(--panel-alt); border: 1px solid var(--border-soft); padding: 6px 8px; border-radius: 3px; font-size: 11px; user-select: text; -webkit-user-select: text; overflow: auto; }
#banner .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border); background: var(--btn); border-radius: 3px; padding: 4px 10px; cursor: default; }
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }

/* ---------- main split ---------- */
#main { flex: 1; display: flex; min-height: 0; position: relative; }
#tree { width: 190px; min-width: 120px; overflow: auto; background: var(--panel); border-right: 1px solid var(--border); display: none; padding: 3px 0; }
body.tree-on #tree { display: block; }
#splitter { width: 4px; cursor: col-resize; display: none; margin-left: -2px; margin-right: -2px; z-index: 2; }
body.tree-on #splitter { display: block; }
.tn { display: flex; align-items: center; gap: 3px; padding: 1px 6px 1px 0; white-space: nowrap; cursor: default; }
.tn:hover { background: var(--hover); }
.tn.cur { background: var(--sel); }
.tn .tw { width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.tn .tw svg { width: 9px; height: 9px; transition: transform .1s; }
.tn.open > .tw svg { transform: rotate(90deg); }
.tn .nm { overflow: hidden; text-overflow: ellipsis; }

#listwrap { flex: 1; overflow: auto; background: var(--panel); position: relative; outline: none; }
table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border-soft); font-weight: 500; text-align: left; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
thead th:hover { background: var(--btn-hover); }
thead th .ar { font-size: 9px; margin-left: 3px; }
tbody td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; border-width: 1px 0; height: 21px; }
tbody tr:nth-child(even) td { background: var(--panel-alt); }
tbody tr:hover td { background: var(--hover); }
tbody tr.sel td { background: var(--sel); border-color: var(--sel-border); }
tbody tr.cursor td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
tbody tr.drop td { background: var(--accent-soft); border-color: var(--accent); }
tbody tr.dot td { color: var(--muted); }
td.name { display: flex; align-items: center; gap: 5px; }
td.name span { overflow: hidden; text-overflow: ellipsis; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
col.c-name { width: auto; } col.c-size { width: 72px; } col.c-date { width: 118px; } col.c-own { width: 70px; } col.c-grp { width: 70px; } col.c-mode { width: 88px; }
@media (max-width: 620px) { .c-own, .c-grp, .col-own, .col-grp { display: none; } }
@media (max-width: 480px) { .c-mode, .col-mode { display: none; } }
@media (max-width: 380px) { .c-date, .col-date { display: none; } }
#empty { padding: 24px; text-align: center; color: var(--muted); display: none; }
#loading { position: absolute; top: 28px; right: 10px; color: var(--muted); display: none; }

#dropzone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 2px dashed var(--accent); z-index: 5; pointer-events: none; font-weight: 600; color: var(--accent); text-align: center; padding: 20px; }
body.dragging #dropzone { display: flex; }

/* ---------- bottom ---------- */
#foot { border-top: 1px solid var(--border); background: var(--bg); padding: 4px 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#foot label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#foot .hint { color: var(--muted); font-size: 11px; }
#count { margin-left: auto; color: var(--muted); white-space: nowrap; }

#xfer { border-top: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; max-height: 40vh; }
#xfer .xh { display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: var(--bg); border-bottom: 1px solid var(--border-soft); }
#xfer .xh .tab { padding: 2px 8px; border-radius: 3px; cursor: default; }
#xfer .xh .tab.on { background: var(--panel); border: 1px solid var(--border); }
#xfer .xh .tab .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; text-align: center; margin-left: 3px; }
#xfer .xh .sp { flex: 1; }
#xfer .xb { overflow: auto; display: none; }
#xfer.open .xb { display: block; }
#xfer .xh .tab .badge[hidden] { display: none; }
.xi { display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 6px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--border-soft); }
.xi .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xi .meta { grid-column: 2; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xi .meta.err { color: var(--danger); }
.xi .acts { grid-row: 1 / span 3; grid-column: 3; display: flex; }
.bar { grid-column: 2; height: 4px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; }
.bar > div { height: 100%; background: var(--bar); width: 0; transition: width .25s; }
.xi.done .bar > div { background: var(--ok); } .xi.error .bar > div { background: var(--danger); }
.xempty { padding: 10px; color: var(--muted); text-align: center; }

/* ---------- menus, dialogs, toasts ---------- */
#menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 4px; padding: 3px 0; min-width: 190px; display: none; }
#menu .mi { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; white-space: nowrap; }
#menu .mi:hover { background: var(--accent); color: #fff; }
#menu .mi:hover svg { color: #fff; }
#menu .mi.dis { opacity: .4; pointer-events: none; }
#menu .mi .k { margin-left: auto; color: var(--muted); font-size: 11px; padding-left: 16px; }
#menu .mi:hover .k { color: #fff; }
#menu .ms { height: 1px; background: var(--border-soft); margin: 3px 0; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 60; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
#modal.show { display: flex; }
.dlg { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); width: min(380px, calc(100vw - 24px)); padding: 12px; }
.dlg h3 { margin: 0 0 8px; font-size: 13px; }
.dlg p { margin: 0 0 8px; color: var(--muted); word-break: break-all; }
.dlg .row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.dlg .row.inline { flex-direction: row; align-items: center; gap: 6px; }
.dlg input[type=text] { width: 100%; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
.perm { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.perm th, .perm td { padding: 3px; text-align: center; border-bottom: 1px solid var(--border-soft); }
.perm th:first-child, .perm td:first-child { text-align: left; }
#toasts { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px; width: min(360px, calc(100vw - 20px)); pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 7px 10px; border-radius: 4px; box-shadow: var(--shadow); word-break: break-word; }
.toast.error { border-left-color: var(--danger); } .toast.ok { border-left-color: var(--ok); }
</style>
</head>

<div id="hdr">
  <div id="conn"><span class="dot"></span><span class="host">—</span><span class="mode"></span></div>
  <button class="ibtn" id="b-pin" title="Blocca su questa sessione"><svg class="i"><use href="#i-pin"/></svg></button>
  <button class="ibtn" id="b-window" title="Apri in una finestra del browser"><svg class="i"><use href="#i-window"/></svg></button>
  <button class="ibtn" id="b-settings" title="Impostazioni"><svg class="i"><use href="#i-gear"/></svg></button>
</div>

<div id="tb">
  <button class="ibtn" data-act="back" title="Indietro"><svg class="i"><use href="#i-back"/></svg></button>
  <button class="ibtn" data-act="fwd" title="Avanti"><svg class="i"><use href="#i-fwd"/></svg></button>
  <button class="ibtn" data-act="up" title="Cartella superiore (⌫)"><svg class="i"><use href="#i-up"/></svg></button>
  <button class="ibtn" data-act="home" title="Home"><svg class="i"><use href="#i-home"/></svg></button>
  <button class="ibtn" data-act="refresh" title="Aggiorna (F5)"><svg class="i"><use href="#i-refresh"/></svg></button>
  <span class="sep"></span>
  <button class="ibtn" data-act="download" title="Scarica i file selezionati"><svg class="i"><use href="#i-download"/></svg></button>

<div id="pathrow">

<div id="main">
  <div id="tree" tabindex="-1"></div>

    <table>
      <colgroup><col class="c-name"><col class="c-size"><col class="c-date"><col class="c-own"><col class="c-grp"><col class="c-mode"></colgroup>
      <thead><tr>
        <th data-k="name">Nome</th><th data-k="size" class="num">Dimensione</th><th data-k="mtime" class="col-date">Modificato</th>
        <th data-k="owner" class="col-own">Proprietario</th><th data-k="group" class="col-grp">Gruppo</th><th data-k="mode" class="col-mode">Permessi</th>
      </tr></thead>

</div>

<div id="xfer">
  <div class="xh">
    <span class="tab on" data-tab="transfers">Trasferimenti<span class="badge" id="xbadge" hidden></span></span>
    <span class="tab" data-tab="edits">In modifica<span class="badge" id="ebadge" hidden></span></span>
    <span class="sp"></span>
    <button class="ibtn" id="b-xclear" title="Rimuovi completati"><svg class="i"><use href="#i-x"/></svg></button>
    <button class="ibtn" id="b-xtoggle" title="Mostra/nascondi"><svg class="i" style="transform:rotate(-90deg)"><use href="#i-chev"/></svg></button>
  </div>
  <div class="xb" id="xbody"></div>

<div id="menu"></div>
<div id="modal"></div>
<div id="toasts"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pj = (base, name) => (base === "/" ? "" : base.replace(/\/+$/, "")) + "/" + name;
const parentOf = p => { const q = p.replace(/\/+$/, ""); const i = q.lastIndexOf("/"); return i <= 0 ? "/" : q.slice(0, i); };
const baseName = p => p.replace(/\/+$/, "").split("/").pop() || "/";
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const store = {
  get(k, d) { try { const v = localStorage.getItem("sftp:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sftp:" + k, JSON.stringify(v)); } catch {} },
};

const S = {
  st: null, targetKey: null, path: null, entries: [], sel: new Set(), anchor: null, cursor: null,
  sort: store.get("sort", { k: "name", d: 1 }), filter: "", back: [], fwd: [], lastPaths: store.get("lastPaths", {}),
  transfers: [], edits: [], xtab: "transfers", loadSeq: 0, tree: new Map(), treeOpen: new Set(["/"]),
};

// ------------------------------------------------------------------ api --
async function api(path, data, method) {
  const opts = { method: method || (data === undefined ? "GET" : "POST"), headers: { "X-Token": TOKEN } };
  if (data !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(data); }
  const r = await fetch(path, opts);
  const text = await r.text();
  if (!r.ok) throw new Error(text.replace(/^\d+: /, "") || r.statusText);
  return text ? JSON.parse(text) : {};
}
const q = o => new URLSearchParams(o).toString();
function toast(text, level = "info", ms = 3500) {
  const el = document.createElement("div");
  el.className = "toast " + level; el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), level === "error" ? 7000 : ms);
}
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, "error"); } }

// ------------------------------------------------------------ websocket --
let ws, wsDelay = 500;
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => { wsDelay = 500; };
  ws.onmessage = ev => onMessage(JSON.parse(ev.data));
  ws.onclose = () => { setConn({ status: "error", label: "Plugin non raggiungibile", mode: "riconnessione…" }); setTimeout(connectWS, wsDelay = Math.min(wsDelay * 2, 8000)); };
}
let changedTimer;
function onMessage(m) {
  if (m.type === "state") onState(m);
  else if (m.type === "transfers") { S.transfers = m.items; renderXfer(); }
  else if (m.type === "edits") { S.edits = m.items; renderXfer(); }
  else if (m.type === "toast") toast(m.text, m.level);
  else if (m.type === "cwd") { if (S.st) S.st.terminal_cwd = m.path; updateFollowHint(); if (m.path && followOn() && S.st?.status === "ready") navigate(m.path, { quiet: true }); }
  else if (m.type === "changed") {
    if (m.path === S.path) { clearTimeout(changedTimer); changedTimer = setTimeout(() => load(S.path, { keepSel: true, quiet: true }), 250); }
    S.tree.delete(m.path);
  }
}

function followOn() { return !!S.st?.settings?.follow; }

function onState(st) {
  const prevKey = S.targetKey, prevStatus = S.st?.status;
  S.st = st;
  const key = st.target ? (st.session_id + "|" + st.target.label) : null;
  S.targetKey = key;
  const t = st.target;
  const modes = {
    ready: t && t.multiplexed ? "connessione riusata (ControlMaster)" : "connessione separata",
    connecting: "connessione in corso…", nomux: "nessun ControlMaster", pam: "proxy PAM (protetta)", error: "errore", nossh: "", idle: "",
  };
  setConn({ status: st.status, label: t ? t.label : (st.session_name || "Nessuna sessione SSH"), mode: modes[st.status] || "",
            title: t ? t.command : "" });
  $("#b-pin").classList.toggle("on", st.pinned);
  $("#b-pin").title = st.pinned ? "Sbloccato: segui la sessione attiva" : "Blocca su questa sessione";
  $("#follow").checked = !!st.settings.follow;
  $("#b-hidden").classList.toggle("on", !!st.settings.show_hidden);
  updateFollowHint();
  renderBanner();
  const ready = st.status === "ready";
  document.body.classList.toggle("offline", !ready);
  $$("#tb .ibtn").forEach(b => { if (!["tree", "hidden"].includes(b.dataset.act)) b.disabled = !ready; });
  if (!ready) { if (key !== prevKey) { S.entries = []; S.path = null; S.sel.clear(); renderRows(); $("#path").value = ""; } return; }
  if (key === prevKey && prevStatus === "ready" && S.path !== null) { renderRows(); renderTree(); return; }
  {
    if (key !== prevKey) { S.back = []; S.fwd = []; S.tree.clear(); S.treeOpen = new Set(["/"]); }
    const start = (followOn() && st.terminal_cwd) || S.lastPaths[t.label] || st.home || "/";
    navigate(start, { noHistory: true, fallback: st.home });
  }
}
function setConn({ status, label, mode, title }) {
  $("#conn .dot").className = "dot " + status;
  $("#conn .host").textContent = label;
  $("#conn .mode").textContent = mode ? "· " + mode : "";
  $("#conn").title = title || "";
}
function updateFollowHint() {
  const has = !!S.st?.terminal_cwd;
  $("#followhint").textContent = S.st?.target && !has && followOn() && S.st.status === "ready" ? "(cartella del terminale non ancora rilevata)" : "";
}

function renderBanner() {
  const st = S.st, b = $("#banner"), t = st.target;
  let html = "";
  if (st.status === "nossh") {
    html = `<h3>Nessuna connessione SSH in questa sessione</h3><p>Apri una sessione con <code>ssh host</code>: il pannello si collega da solo alla stessa connessione.</p>`;
  } else if (st.status === "pam") {
    html = `<h3>Connessione tramite proxy PAM</h3><p>${esc(t.label)} passa da un proxy che registra la sessione: aprire un canale SFTP la farebbe cadere, quindi il pannello non la tocca.</p>`;
  } else if (st.status === "nomux") {
    html = `<h3>Impossibile riusare la connessione a ${esc(t.label)}</h3>
      <p>Per questa sessione non c'è un ControlMaster attivo. Aggiungi questo a <code>~/.ssh/config</code> e ricollegati: il pannello userà la stessa connessione (senza password o 2FA di nuovo).</p>
      <pre>${esc(st.snippet)}</pre>
      <div class="actions"><button class="btn" data-b="copysnippet">Copia configurazione</button>
      <button class="btn primary" data-b="direct">Apri una nuova connessione (chiavi/agent)</button>
      <button class="btn" data-b="recheck">Ricontrolla</button></div>`;
  } else if (st.status === "error") {
    html = `<h3>Connessione SFTP fallita</h3><p>${esc(st.error)}</p>
      <div class="actions"><button class="btn primary" data-b="recheck">Riprova</button>
      ${t && !t.multiplexed ? '<button class="btn" data-b="copysnippet">Copia config ControlMaster</button>' : ""}</div>`;
  }
  b.innerHTML = html;
  b.classList.toggle("show", !!html);
}
$("#banner").addEventListener("click", e => {
  const a = e.target.closest("[data-b]")?.dataset.b;
  if (a === "copysnippet") run(async () => { await api("/api/copy", { text: S.st.snippet }); toast("Configurazione copiata negli appunti", "ok"); });
  if (a === "direct") run(() => api("/api/connect_direct", {}));
  if (a === "recheck") run(() => api("/api/reconnect", {}));
});

// ------------------------------------------------------------ navigation --
async function navigate(path, opts = {}) {
  if (!path) return;
  const prev = S.path;
  const ok = await load(path, opts);
  if (ok && prev && prev !== S.path && !opts.noHistory) { S.back.push(prev); S.fwd = []; }
  updateNavButtons();
}
async function load(path, opts = {}) {
  const seq = ++S.loadSeq;
  if (!opts.quiet) $("#loading").style.display = "block";
  try {
    const r = await api("/api/ls?" + q({ path }));
    if (seq !== S.loadSeq) return false;
    const changedDir = r.path !== S.path;
    S.path = r.path; S.entries = r.entries;
    S.tree.set(r.path, r.entries.filter(e => e.dir).map(e => e.name));
    if (changedDir || !opts.keepSel) { S.sel.clear(); S.anchor = null; S.cursor = null; }
    else { const names = new Set(r.entries.map(e => e.name)); S.sel = new Set([...S.sel].filter(n => names.has(n))); }
    setPathField(S.path);
    if (S.st?.target) { S.lastPaths[S.st.target.label] = S.path; store.set("lastPaths", S.lastPaths); }
    if (changedDir) { $("#filter").value = ""; S.filter = ""; $("#listwrap").scrollTop = 0; }
    renderRows(); renderTree();
    return true;
  } catch (e) {
    if (seq !== S.loadSeq) return false;
    if (opts.fallback && opts.fallback !== path) return load(opts.fallback, { ...opts, fallback: null });
    if (!opts.quiet) toast(`${path}: ${e.message}`, "error");
    $("#path").value = S.path || "";
    return false;
  } finally {
    if (seq === S.loadSeq) $("#loading").style.display = "none";
  }
}
function setPathField(p) {
  const el = $("#path"); el.value = p;
  if (document.activeElement !== el) requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
}
function updateNavButtons() {
  const ready = S.st?.status === "ready";
  $('[data-act="back"]').disabled = !ready || !S.back.length;
  $('[data-act="fwd"]').disabled = !ready || !S.fwd.length;
  $('[data-act="up"]').disabled = !ready || S.path === "/";
}
function goBack() { if (!S.back.length) return; S.fwd.push(S.path); navigate(S.back.pop(), { noHistory: true }); }
function goFwd() { if (!S.fwd.length) return; S.back.push(S.path); navigate(S.fwd.pop(), { noHistory: true }); }
function goUp() {
  if (S.path === "/") return;
  const from = baseName(S.path);
  navigate(parentOf(S.path)).then(() => { if (S.entries.some(e => e.name === from)) { S.sel = new Set([from]); S.cursor = S.anchor = from; renderRows(true); } });
}

// ---------------------------------------------------------------- list ---
function visibleEntries() {
  const hidden = !!S.st?.settings?.show_hidden, f = S.filter.toLowerCase();
  const list = S.entries.filter(e => (hidden || !e.name.startsWith(".")) && (!f || e.name.toLowerCase().includes(f)));
  const { k, d } = S.sort;
  const cmpName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
  list.sort((a, b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1;
    let r = 0;
    if (k === "size" || k === "mtime") r = (a[k] || 0) - (b[k] || 0);
    else if (k !== "name") r = String(a[k] || "").localeCompare(String(b[k] || ""));
    return (r || cmpName(a, b)) * d;
  });
  return list;
}
const EXT = {
  code: "py js ts tsx jsx sh bash zsh rb go rs c h cpp java php pl lua json yml yaml toml xml html css conf cfg ini env sql md".split(" "),
  img: "png jpg jpeg gif svg webp bmp ico tiff heic".split(" "),
  zip: "zip tar gz tgz bz2 xz 7z rar zst deb rpm jar".split(" "),
};
function fileIcon(e) {
  if (e.dir) return e.link ? "i-folder-link" : "i-folder";
  if (e.link) return "i-file-link";
  const x = e.name.includes(".") ? e.name.split(".").pop().toLowerCase() : "";
  if (EXT.code.includes(x)) return "i-file-code";
  if (EXT.img.includes(x)) return "i-file-img";
  if (EXT.zip.includes(x)) return "i-file-zip";
  return "i-file";
}
function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n < 10 ? n.toFixed(1) : Math.round(n)) + " " + u[i];
}
function fmtDate(t) {
  if (!t) return "";
  const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let VIS = [];
function renderRows(scrollToCursor) {
  VIS = visibleEntries();
  const rows = [];
  if (S.path && S.path !== "/" && !S.filter) rows.push(`<tr class="dot" data-up="1"><td class="name">${icon("i-folder")}<span>..</span></td><td></td><td class="col-date"></td><td class="col-own"></td><td class="col-grp"></td><td class="col-mode"></td></tr>`);
  for (const e of VIS) {
    const cls = [S.sel.has(e.name) ? "sel" : "", S.cursor === e.name ? "cursor" : "", e.name.startsWith(".") ? "dot" : ""].join(" ");
    rows.push(`<tr class="${cls}" data-n="${esc(e.name)}" draggable="false">
      <td class="name" title="${esc(e.name)}">${icon(fileIcon(e))}<span>${esc(e.name)}</span></td>
      <td class="num">${e.dir ? "" : fmtSize(e.size)}</td>
      <td class="col-date">${fmtDate(e.mtime)}</td>
      <td class="col-own">${esc(e.owner)}</td><td class="col-grp">${esc(e.group)}</td>
      <td class="col-mode mono">${esc(e.mode)}</td></tr>`);
  }
  $("#rows").innerHTML = rows.join("");
  $("#empty").style.display = S.path && !VIS.length ? "block" : "none";
  $$("thead th").forEach(th => {
    th.querySelector(".ar")?.remove();
    if (th.dataset.k === S.sort.k) th.insertAdjacentHTML("beforeend", `<span class="ar">${S.sort.d > 0 ? "▲" : "▼"}</span>`);
  });
  updateStatus();
  if (scrollToCursor && S.cursor) rowEl(S.cursor)?.scrollIntoView({ block: "nearest" });
}
function updateStatus() {
  const nd = VIS.filter(e => e.dir).length, nf = VIS.length - nd;
  const selSize = VIS.filter(e => S.sel.has(e.name) && !e.dir).reduce((a, e) => a + (e.size || 0), 0);
  $("#count").textContent = S.sel.size ? `${S.sel.size} selezionati${selSize ? " · " + fmtSize(selSize) : ""}` : (S.path ? `${nd} cartelle, ${nf} file` : "");
  updateToolbar();
}
// Selection changes only toggle classes: rebuilding the rows between the two clicks
// of a double click makes WKWebView (iTerm2 Toolbelt) drop the dblclick event.
function paintSelection(scrollToCursor) {
  for (const tr of $$("#rows tr[data-n]")) {
    tr.classList.toggle("sel", S.sel.has(tr.dataset.n));
    tr.classList.toggle("cursor", S.cursor === tr.dataset.n);
  }
  updateStatus();
  if (scrollToCursor && S.cursor) rowEl(S.cursor)?.scrollIntoView({ block: "nearest" });
}
const rowEl = name => $$("#rows tr[data-n]").find(tr => tr.dataset.n === name);
const entry = name => S.entries.find(e => e.name === name);
const selected = () => VIS.filter(e => S.sel.has(e.name));
function updateToolbar() {
  const ready = S.st?.status === "ready", sel = selected(), one = sel.length === 1;
  const set = (a, on) => { const b = $(`[data-act="${a}"]`); if (b) b.disabled = !ready || !on; };
  set("download", sel.length > 0); set("delete", sel.length > 0); set("rename", one); set("chmod", sel.length > 0);
  set("edit", one && !sel[0].dir); set("upload", true); set("newfile", true); set("newfolder", true); set("cdterm", true);
  set("home", true); set("refresh", true);
  updateNavButtons();
}

$$("thead th").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k;
  S.sort = S.sort.k === k ? { k, d: -S.sort.d } : { k, d: 1 };
  store.set("sort", S.sort); renderRows();
}));

const rowsEl = $("#rows");
let lastClick = { key: null, t: 0, x: 0, y: 0 };
rowsEl.addEventListener("mousedown", e => {
  const tr = e.target.closest("tr"); if (!tr || e.button === 2 && S.sel.has(tr.dataset.n)) return;
  const n = tr.dataset.up ? ".." : tr.dataset.n;
  // our own double-click detection (works even if the native dblclick is lost)
  if (e.button === 0 && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
    const now = Date.now(), near = Math.abs(e.clientX - lastClick.x) < 6 && Math.abs(e.clientY - lastClick.y) < 6;
    if (lastClick.key === n && now - lastClick.t < 450 && near) {
      lastClick = { key: null, t: 0, x: 0, y: 0 };
      e.preventDefault();
      return n === ".." ? goUp() : activate(entry(n));
    }
    lastClick = { key: n, t: now, x: e.clientX, y: e.clientY };
  }
  if (tr.dataset.up) return;
  if (e.shiftKey && S.anchor) {
    const names = VIS.map(x => x.name), a = names.indexOf(S.anchor), b = names.indexOf(n);
    const [lo, hi] = a < b ? [a, b] : [b, a];
    if (!(e.metaKey || e.ctrlKey)) S.sel.clear();
    names.slice(lo, hi + 1).forEach(x => S.sel.add(x));
  } else if (e.metaKey || e.ctrlKey) {
    S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); S.anchor = n;
  } else { S.sel = new Set([n]); S.anchor = n; }
  S.cursor = n; paintSelection();
});
$("#listwrap").addEventListener("mousedown", e => { if (!e.target.closest("tr") && e.button === 0 && !e.target.closest("thead")) { S.sel.clear(); paintSelection(); } });
rowsEl.addEventListener("dblclick", e => e.preventDefault()); // handled in mousedown
function activate(e) {
  if (!e) return;
  if (e.dir) return navigate(pj(S.path, e.name));
  const how = S.st.settings.dblclick;
  if (how === "open") return openLocal(e);
  if (how === "download") return download([e]);
  return edit(e);
}

// ------------------------------------------------------------- actions ---
function act(a) {
  const sel = selected();
  switch (a) {
    case "back": return goBack();
    case "fwd": return goFwd();
    case "open": return activate(sel[0]);
    case "up": return goUp();
    case "home": return navigate(S.st.home || "/");
    case "refresh": S.tree.clear(); return load(S.path, { keepSel: true });
    case "download": return download(sel);
    case "downloadto": return download(sel, true);
    case "upload": return uploadPick(false);
    case "uploadfolder": return uploadPick(true);
    case "newfile": return newItem(false);
    case "newfolder": return newItem(true);
    case "edit": return sel[0] && !sel[0].dir && edit(sel[0]);
    case "openlocal": return sel[0] && !sel[0].dir && openLocal(sel[0]);
    case "rename": return sel.length === 1 && rename(sel[0]);
    case "chmod": return sel.length && chmod(sel);
    case "delete": return sel.length && del(sel);
    case "cdterm": return run(() => api("/api/cd", { path: sel.length === 1 && sel[0].dir ? pj(S.path, sel[0].name) : S.path }));
    case "copypath": return run(async () => { await api("/api/copy", { text: (sel.length ? sel.map(e => pj(S.path, e.name)) : [S.path]).join("\n") }); toast("Percorso copiato", "ok"); });

      const pct = t.total ? Math.min(100, t.done / t.total * 100) : (t.state === "done" ? 100 : 0);
      const stateTxt = { queued: "in coda", running: `${fmtSize(t.done)} / ${fmtSize(t.total)} · ${fmtSize(t.speed)}/s`, done: `${fmtSize(t.done)} · completato`, error: t.error, cancelled: "annullato" }[t.state];
      const where = t.kind === "down" ? (t.local || "") : t.remote;
      return `<div class="xi ${t.state}" title="${esc(where)}">${icon(t.kind === "down" ? "i-arrow-down" : "i-arrow-up")}
        <div class="n">${esc(t.name)}</div>
        <div class="acts">${t.state === "running" || t.state === "queued" ? `<button class="ibtn" data-cancel="${t.id}" title="Annulla">${icon("i-x")}</button>` : ""}
          ${t.kind === "down" && t.state === "done" ? `<button class="ibtn" data-reveal="${t.id}" title="Mostra nel Finder">${icon("i-find")}</button>` : ""}</div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="meta ${t.state === "error" ? "err" : ""}">${esc(stateTxt)}</div></div>`;
    }).join("");
  } else {
    if (!S.edits.length) { body.innerHTML = '<div class="xempty">Nessun file in modifica. Doppio clic su un file per aprirlo nell\'editor: a ogni salvataggio viene caricato sul server.</div>'; return; }
    body.innerHTML = S.edits.map(e => `<div class="xi ${e.state === "error" ? "error" : ""}" title="${esc(e.host + ":" + e.remote)}">${icon("i-edit")}
      <div class="n">${esc(e.name)}</div>
      <div class="acts"><button class="ibtn" data-stopedit="${e.id}" title="Smetti di sincronizzare">${icon("i-x")}</button></div>
      <div class="meta">${esc(e.host)}:${esc(e.remote)}</div>
      <div class="meta ${e.state === "error" ? "err" : ""}">${e.state === "uploading" ? "caricamento…" : e.state === "error" ? esc(e.error) : e.saved_at ? "salvato alle " + new Date(e.saved_at * 1000).toLocaleTimeString() : "in attesa di salvataggio"}</div></div>`).join("");
  }
}
$("#xbody").addEventListener("click", e => {
  const c = e.target.closest("[data-cancel]"), r = e.target.closest("[data-reveal]"), s = e.target.closest("[data-stopedit]");
  if (c) run(() => api("/api/cancel", { id: c.dataset.cancel }));
  if (r) run(() => api("/api/reveal", { id: r.dataset.reveal }));
  if (s) run(() => api("/api/edit_stop", { id: s.dataset.stopedit }));
});

// ----------------------------------------------------------------- boot --
if (store.get("xopen", false)) openXfer(); else updateXToggle();
if (store.get("tree", false)) toggleTree(true);
renderXfer();
connectWS();
$("#listwrap").focus();
</script>
</body>
</html>
